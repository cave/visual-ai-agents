<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Office</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='4' width='12' height='10' rx='3' fill='%232f9e73'/%3E%3Ccircle cx='6' cy='9' r='1.3' fill='white'/%3E%3Ccircle cx='10' cy='9' r='1.3' fill='white'/%3E%3Crect x='7.4' y='1' width='1.2' height='3' fill='%232f9e73'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="office.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Agent Office</h1>
      <p class="headline" id="headline">Checking who's in…</p>
    </div>
    <div class="top-actions">
      <span class="live" id="live" title="Refreshes every 3 seconds"><i></i><span id="live-text">Live</span></span>
      <a class="btn" href="/">Usage &amp; cost</a>
      <button id="theme" class="btn" type="button">Theme</button>
    </div>
  </header>

  <ul class="legend" aria-label="What the poses mean">
    <li><i class="dot working"></i>Typing: working right now</li>
    <li><i class="dot needs-you"></i>Hand up: needs your answer</li>
    <li><i class="dot done"></i>Waving: just finished, your turn</li>
    <li><i class="dot break"></i>Coffee: idle for hours</li>
    <li><i class="dot asleep"></i>Asleep: idle for over a day</li>
    <li class="tip">Click a computer to open its terminal, or a robot for details.</li>
  </ul>

  <main id="stage" class="stage"><div id="floor" class="floor" aria-live="polite"></div></main>

  <dialog id="card" class="card" aria-labelledby="card-name">
    <div id="card-body"></div>
    <div class="card-actions" id="card-actions"></div>
    <p class="card-note" id="card-note" role="status"></p>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="office.js"></script>
</body>
</html>
